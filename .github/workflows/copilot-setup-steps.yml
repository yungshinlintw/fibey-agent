name: "Copilot Setup Steps"

# Run automatically when this file changes, and allow manual runs from the Actions tab.
on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # ── Python / uv ──────────────────────────────────────────────────
            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  version: "latest"
                  enable-cache: true

            - name: Set up Python 3.12
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install root Python dependencies
              run: uv sync

            - name: Install inventory-mcp dependencies
              working-directory: services/inventory-mcp
              run: uv sync

            - name: Install work-orders-api dependencies
              working-directory: services/work-orders-api
              run: uv sync

            # ── Node.js / npm ────────────────────────────────────────────────
            - name: Set up Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: ui/package-lock.json

            - name: Install UI dependencies
              working-directory: ui
              run: npm ci
